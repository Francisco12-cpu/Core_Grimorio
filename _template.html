<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nome do Manuscrito</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='26%25' r='82%25'%3E%3Cstop offset='0%25' stop-color='%23fdeeb0'/%3E%3Cstop offset='45%25' stop-color='%23e8bb3f'/%3E%3Cstop offset='100%25' stop-color='%238B6914'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='48' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='50' r='48' fill='none' stroke='%235c4108' stroke-width='1.5' opacity='0.5'/%3E%3Cpath fill='%239c1616' stroke='%233a0505' stroke-width='1.5' stroke-linejoin='round' d='M27 23 L40 32 L34 39 L48 49 L50 50 L52 49 L66 39 L60 32 L73 23 L76 27 L64 37 L70 42 L56 51 L54 52.5 L56 54 L70 63 L64 68 L76 78 L73 82 L60 73 L66 66 L52 56.5 L50 55 L48 56.5 L34 66 L40 73 L27 82 L24 78 L36 68 L30 63 L44 54 L46 52.5 L44 51 L30 42 L36 37 L24 27 Z'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=IM+Fell+English:ital@0;1&display=swap');

  :root {
    --bg: #0d0a07;
    --card-bg: #e8d5b5;
    --card-border: #b89e6e;
    --card-text: #3a2a1a;
    --gold: #d4af37;
    --gold-dark: #8B6914;
    --red: #8b1a1a;
    --fonte-titulo: 'Cinzel', serif;
    --fonte-texto: 'IM Fell English', serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    background: var(--bg);
    font-family: var(--fonte-texto);
    color: var(--card-text);
    overflow-x: hidden;
  }

  body {
    position: relative;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(212,175,55,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(139,26,26,0.15) 0%, transparent 50%);
  }

  .poeira { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .poeira span {
    position: absolute;
    width: 4px; height: 4px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0.5;
    box-shadow: 0 0 8px var(--gold);
    animation: flutuar 8s infinite alternate ease-in-out;
  }
  @keyframes flutuar {
    from { transform: translateY(0) translateX(0); opacity: 0.2; }
    to   { transform: translateY(-40vh) translateX(15px); opacity: 0.8; }
  }

  .pagina {
    position: relative; z-index: 2;
    max-width: 760px;
    margin: 0 auto;
    padding: 6vh 6vw 10vh;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
    padding-bottom: 1.2rem;
    border-bottom: 2px solid var(--gold-dark);
  }
  .rotulo-topo {
    font-family: var(--fonte-titulo);
    font-size: 0.8rem;
    letter-spacing: 5px;
    color: var(--gold-dark);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--fonte-titulo);
    font-weight: 900;
    font-size: clamp(2rem, 8vw, 3.2rem);
    color: var(--gold);
    text-shadow: 0 0 25px rgba(212,175,55,0.5);
    letter-spacing: 3px;
  }

  .conteudo {
    background: var(--card-bg);
    color: var(--card-text);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 2rem 2.2rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,240,0.35);
    line-height: 1.7;
    font-size: 1.05rem;
  }
  .conteudo h2 {
    font-family: var(--fonte-titulo);
    color: #4a2c0f;
    margin: 1.5rem 0 0.6rem;
  }
  .conteudo p { margin-bottom: 1rem; }

  @media (max-width: 600px) {
    .pagina { padding: 5vh 5vw 8vh; }
    .conteudo { padding: 1.4rem 1.3rem; font-size: 1rem; }
  }

  /* Modo sonho: ativado via ?estilo=sonho na URL (definido pelo mestre no menu.json) */
  body.core-modo-sonho {
    filter: blur(0.4px) saturate(1.3) brightness(0.96);
    transition: filter 1.2s ease;
  }
  body.core-modo-sonho::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(20,10,30,0.35) 100%);
    pointer-events: none;
    z-index: 999;
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>

<div class="poeira" id="poeira"></div>

<div class="pagina">
  <header>
    <div class="rotulo-topo">C.O.R.E. — Manuscrito</div>
    <h1>Nome do Manuscrito</h1>
  </header>

  <div class="conteudo">
    <h2>Título da seção</h2>
    <p>Escreva aqui o conteúdo do manuscrito. Este template já vem com viewport travado, fontes do projeto, cores do tema e responsividade básica pronta.</p>
  </div>
</div>

<script>
  (function criarPoeira() {
    const container = document.getElementById('poeira');
    for (let i = 0; i < 30; i++) {
      const span = document.createElement('span');
      span.style.left = Math.random() * 100 + '%';
      span.style.top = Math.random() * 100 + '%';
      span.style.animationDelay = Math.random() * 10 + 's';
      container.appendChild(span);
    }
  })();

  (function ativarModoSonho() {
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.get('estilo') === 'sonho') {
        document.body.classList.add('core-modo-sonho');
      }
    } catch (e) {}
  })();
</script>
</body>
</html>
